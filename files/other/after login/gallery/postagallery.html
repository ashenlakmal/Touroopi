<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Modal Form</title>
    <!-- Bootstrap CSS -->

<body>

<!-- Button to trigger modal -->
<button type="button" class="btn btn-primary" data-toggle="modal" data-target="#exampleModal">
    Open Form Modal
</button>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Form Title</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="uploadpost" action="gallery.php" method="post">
                    <div class="form-group">
                        <label for="name" class="col-form-label">Upload One photo :</label>
                        <input type="file" id="photo" name="photo" class="btn btn-secondary" required>
                    </div>
                    <div class="form-group">
                        <label for="name" class="col-form-label">Title of your gallery :</label>
                        <input type="text" class="form-control" id="name" name="title" placeholder="Colombo citylife" required>
                    </div>
                    <div class="form-group">
                        <label for="message" class="col-form-label">Text Content (you can write a paragraphs here):</label>
                        <textarea class="form-control" id="message" name="text" rows="3" required></textarea>
                    </div>

                    <button type="button" class="btn btn-danger mt-2" data-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-success mt-2 ms-3" id="submit">Post Your gallery</button>
                </form>
            </div>
        </div>
    </div>
</div>
